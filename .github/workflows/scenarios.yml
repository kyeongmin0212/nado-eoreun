# 루프톤 시나리오 검사. 주최 측 실행과 같은 순서로 docker compose 기동 → /__health 대기 → Playwright 실행.
# 키트 workflows/scenarios.yml 기반. AI 기능을 쓰므로 학생이 GitHub Settings → Secrets and variables → Actions 에
# AI_GATEWAY_API_KEY 를 직접 넣는다. 실제 AI 호출이 팀 예산에서 쓰이므로 문서만 바뀐 push 에서는 돌지 않게 한다.
name: scenarios

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "nado-eoreun-handoff/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # 버전은 package.json 의 packageManager 를 따른다
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec next typegen
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm build

  scenarios:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7
      - name: Build app
        run: RELEASE_ID="$GITHUB_SHA" docker compose build app
      - name: Start app and database
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
        run: |
          echo "APP_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
          RELEASE_ID="$GITHUB_SHA" docker compose up -d
      - name: Wait for /__health
        run: |
          # 빌드 시간과 기동 시간을 분리하고, DB 시작부터 준비 완료까지 2분 안인지 확인한다.
          deadline=$((APP_STARTED_AT + 120))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if body=$(curl --max-time 3 -fsS http://localhost:3000/__health) &&
              echo "$body" | jq -e --arg sha "$GITHUB_SHA" '.releaseId == $sha' > /dev/null; then
              echo "Ready with matching releaseId in $(($(date +%s) - APP_STARTED_AT)) seconds"
              exit 0
            fi
            sleep 2
          done
          echo "/__health가 기동 후 120초 안에 200과 현재 commit의 releaseId를 주지 않았다"
          docker compose logs app
          exit 1
      - name: Show integration status (booleans only)
        run: |
          # imageGateway 가 false 면 AI_GATEWAY_API_KEY 시크릿이 컨테이너에 전달되지 않은 것이다. 값은 출력하지 않는다.
          curl -fsS http://localhost:3000/api/status; echo
      - name: Read seed account from docker-compose.yml
        run: |
          config="$(docker compose config --format json)"
          email="$(echo "$config" | jq -r '.services.app.environment.SEED_USER_EMAIL // empty')"
          password="$(echo "$config" | jq -r '.services.app.environment.SEED_USER_PASSWORD // empty')"
          if [ -n "$email" ] && [ -n "$password" ]; then
            echo "E2E_USER_EMAIL=$email" >> "$GITHUB_ENV"
            echo "E2E_USER_PASSWORD=$password" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run scenario E2E
        working-directory: e2e
        env:
          # Node 23.6+ 의 네이티브 TS 처리와 Playwright 로더가 충돌하지 않도록 끈다
          NODE_OPTIONS: --no-experimental-strip-types
        run: |
          npm install
          npx playwright install --with-deps chromium
          npx playwright test --forbid-only
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report
      - name: Stop containers
        if: always()
        run: |
          docker compose logs app --tail 200
          docker compose down -v
